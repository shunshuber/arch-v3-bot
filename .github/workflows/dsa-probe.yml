name: dsa-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Probe DSA form via proxies
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright

          URL = "https://telegram.org/dsa-report"
          proxies = [l.strip() for l in Path("proxies.txt").read_text(
              encoding="utf-8").splitlines()
              if l.strip() and not l.startswith("#")][:15]


          async def main():
              async with async_playwright() as pw:
                  b = await pw.chromium.launch(args=["--no-sandbox"])
                  for server in proxies:
                      p = None
                      try:
                          p = await b.new_page(locale="en-US",
                                               proxy={"server": server})
                          await p.goto(URL, wait_until="domcontentloaded",
                                       timeout=15000)
                          await p.wait_for_timeout(1200)
                          start = await p.locator(".js-report-start-btn").count()
                          comment = await p.locator(".cd-comment-input").count()
                          print(f"PX {server.split('@')[-1]} -> {p.url} | "
                                f"start={start} comment={comment} | "
                                f"{(await p.title())[:60]}", flush=True)
                          if start or comment:
                              print("FORM FOUND VIA", server, flush=True)
                              break
                      except Exception as e:
                          print(f"PX {server.split('@')[-1]} ERR "
                                f"{type(e).__name__}", flush=True)
                      finally:
                          if p is not None:
                              try:
                                  await p.close()
                              except Exception:
                                  pass
                  await b.close()


          asyncio.run(main())
          PY
