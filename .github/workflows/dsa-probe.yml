name: dsa-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Probe DSA URLs
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          import os
          from pathlib import Path

          CANDIDATES = [
              "https://telegram.org/dsa-report",
              "https://telegram.org/dsa",
              "https://telegram.org/legal/dsa",
          ]
          lines = [l.strip() for l in Path("paid_proxies.txt").read_text(
              encoding="utf-8").splitlines()
              if l.strip() and not l.startswith("#")]
          proxies = [{"server": line} for line in lines]
          print("proxies:", len(proxies), flush=True)


          async def main():
              async with async_playwright() as pw:
                  b = await pw.chromium.launch(args=["--no-sandbox"])
                  p = None
                  for px in proxies:
                      try:
                          cand = await b.new_page(locale="en-US", proxy=px)
                          await cand.goto("https://telegram.org/",
                                          wait_until="domcontentloaded",
                                          timeout=15000)
                          p = cand
                          print("working proxy:", px["server"].split("@")[-1],
                                flush=True)
                          break
                      except Exception as e:
                          print("proxy failed:", px["server"].split("@")[-1],
                                type(e).__name__, flush=True)
                  if p is None:
                      print("no working proxy", flush=True)
                      await b.close()
                      return
                  links = await p.eval_on_selector_all(
                      "a[href]",
                      "els => els.map(e => e.href).filter(h => /dsa|report/i.test(h))")
                  print("HOME DSA LINKS:", links[:20], flush=True)
                  for url in CANDIDATES:
                      try:
                          await p.goto(url, wait_until="domcontentloaded", timeout=20000)
                          await p.wait_for_timeout(1500)
                          title = await p.title()
                          body = (await p.locator("body").inner_text())[:250].replace("\n", " ")
                          start = await p.locator(".js-report-start-btn").count()
                          comment = await p.locator(".cd-comment-input").count()
                          print(f"URL {url} -> {p.url} | {title} | start={start} "
                                f"comment={comment} | {body}", flush=True)
                      except Exception as e:
                          print(f"URL {url} -> ERR {type(e).__name__}: {e}", flush=True)
                  await b.close()


          asyncio.run(main())
          PY
