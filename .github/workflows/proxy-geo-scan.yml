name: proxy-geo-scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install aiohttp aiohttp-socks
      - name: Scan free proxies for EU + DSA form
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          import aiohttp
          from aiohttp_socks import ProxyConnector

          URLS = [l.strip() for l in Path("proxies.txt").read_text(
              encoding="utf-8").splitlines()
              if l.strip() and not l.startswith("#")][:20]
          EU = {"DE", "FR", "NL", "IT", "ES", "PL", "SE", "FI", "DK", "AT",
                "BE", "CH", "IE", "PT", "CZ", "HU", "RO", "GR", "LU", "NO"}


          async def main():
              for url in URLS:
                  host = url.split("@")[-1]
                  connector = ProxyConnector.from_url(url)
                  try:
                      async with aiohttp.ClientSession(connector=connector) as s:
                          try:
                              async with s.get("https://ipinfo.io/json",
                                      timeout=aiohttp.ClientTimeout(total=10)) as r:
                                  geo = await r.json(content_type=None)
                              country = geo.get("country", "?")
                          except Exception:
                              country = "?"
                          if country in EU:
                              try:
                                  async with s.get(
                                      "https://telegram.org/dsa-report",
                                      allow_redirects=False,
                                      timeout=aiohttp.ClientTimeout(total=12)) as r:
                                      html = await r.text()
                                  has = "js-report-start-btn" in html
                                  print("EU", host, country, "status", r.status,
                                        "form", has, flush=True)
                              except Exception as e:
                                  print("EU", host, country, "DSA ERR",
                                        type(e).__name__, flush=True)
                          else:
                              print("--", host, country, flush=True)
                  except Exception:
                      print("--", host, "connector fail", flush=True)
                  finally:
                      await connector.close()


          asyncio.run(main())
          PY
