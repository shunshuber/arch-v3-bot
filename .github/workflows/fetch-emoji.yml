name: fetch-emoji

on:
  workflow_dispatch:
    inputs:
      short_name:
        description: "emoji pack short name"
        required: true
        default: "NewsEmoji"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      SHORT_NAME: ${{ inputs.short_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch emoji ids
        run: |
          python - <<'PY'
          import asyncio, os
          from pathlib import Path
          import snoser
          from telethon import TelegramClient
          from telethon.tl.functions.messages import GetStickerSetRequest
          from telethon.tl.types import InputStickerSetShortName

          async def main():
              name = '7055196067_new'
              sess = Path('sessions') / f'{name}.session'
              fp = snoser.session_fingerprint(name)
              c = TelegramClient(str(sess.with_suffix('')), fp['api_id'],
                                 fp['api_hash'],
                                 proxy=snoser.pin_for_session(
                                     name, snoser.load_pin_proxies()),
                                 device_model=fp['device'],
                                 system_version=fp['system_version'],
                                 app_version=fp['app_version'],
                                 lang_code=fp['lang_code'])
              await c.connect()
              print('AUTH:', await c.is_user_authorized(), flush=True)
              res = await c(GetStickerSetRequest(
                  stickerset=InputStickerSetShortName(os.environ['SHORT_NAME']),
                  hash=0))
              print('TITLE:', res.set.title, 'COUNT:', len(res.stickers), flush=True)
              for st in res.stickers:
                  print('EMOJI', repr(st.emoji), 'ID', st.id, flush=True)
              await c.disconnect()

          asyncio.run(main())
          PY
