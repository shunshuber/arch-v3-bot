name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cloudtips bundles + api + tg bots
        shell: bash
        run: |
          echo "=== env.js ==="
          curl -s "https://pay.cloudtips.ru/assets/env.js" -o /tmp/env.js \
            -w "HTTP %{http_code} size %{size_download}\n"
          cat /tmp/env.js
          echo
          echo "=== main.js bundle ==="
          curl -s "https://pay.cloudtips.ru/main.53cccfc72e5faa58.js" \
            -o /tmp/main.js -w "HTTP %{http_code} size %{size_download}\n"
          python3 - <<'PY'
          import re
          t = open("/tmp/main.js", encoding="utf-8", errors="replace").read()
          urls = sorted(set(re.findall(r"https://[a-z0-9.\-]+", t)))
          print("hardcoded urls:", [u for u in urls if "cloudtips" in u
                                    or "psbank" in u or "api" in u][:20])
          paths = sorted(set(re.findall(r'"/?api/[a-zA-Z0-9/_\-]+', t)))[:40]
          print("api paths:")
          for p in paths:
              print("  ", p)
          for kw in ["amount", "comment", "sbp", "recurrent", "payer",
                     "paymentpage", "externalId", "orderId"]:
              n = len(re.findall(kw, t, re.I))
              print(f"kw {kw!r}: {n}")
          idx = t.lower().find("paymentpage")
          if idx >= 0:
              print("ctx paymentpage:", t[max(0, idx-150):idx+250][:380])
          PY
          echo
          echo "=== api probes ==="
          for u in "https://api.cloudtips.ru/swagger/v1/swagger.json" \
                   "https://api.cloudtips.ru/api/payment/page/a5139821" \
                   "https://api.cloudtips.ru/index.html"; do
            echo "-- $u"
            curl -s -o /tmp/a.txt -w "HTTP %{http_code} size %{size_download}\n" "$u"
            head -c 260 /tmp/a.txt; echo
          done
          echo
          echo "=== cloudtips tg bots (getChat) ==="
          for name in cloudtips_bot CloudTipsBot cloudtips CloudtipsBot cloudtips_ru cloudtips_payment_bot; do
            code=$(curl -s -o /tmp/g.json -w "%{http_code}" \
              "https://api.telegram.org/bot$BOT_TOKEN/getChat?chat_id=@$name")
            echo "$name -> $code $(head -c 200 /tmp/g.json)"
          done
