name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract xRocket Pay API endpoints from docs
        run: |
          python - <<'PY'
          import re, urllib.request

          def get(url):
              req = urllib.request.Request(url,
                                           headers={"User-Agent":
                                                    "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode("utf-8", errors="replace")

          print("=== sitemap pages ===")
          sm = get("https://docs.xrocket.tg/sitemap.xml")
          urls = re.findall(r"<loc>(.*?)</loc>", sm)
          for u in urls:
              print("-", u)

          print()
          print("=== pay/api related pages: endpoint lines ===")
          for u in urls:
              if not re.search(r"pay|api", u, re.I):
                  continue
              try:
                  page = get(u)
              except Exception as e:
                  print("FAIL", u, e)
                  continue
              text = re.sub(r"<script.*?</script>", " ", page, flags=re.S)
              text = re.sub(r"<[^>]+>", " ", text)
              text = re.sub(r"\s+", " ", text)
              keep = []
              for m in re.finditer(
                      r".{80}(https://[^\s]*api[^\s]*|/api/v\d[^\s]*"
                      r"|Bearer|Authorization|GET |POST |base.?url)"
                      r".{140}", text, re.I):
                  w = m.group(0).strip()
                  if w not in keep:
                      keep.append(w)
              if keep:
                  print("PAGE", u)
                  for w in keep[:18]:
                      print("  ...", w, "...")
          PY
