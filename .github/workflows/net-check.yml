name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRYPTOBOT_TOKEN: ${{ secrets.CRYPTOBOT_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: CryptoBot method scope probe
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, requests
          tok = os.environ["CRYPTOBOT_TOKEN"]
          H = {"Crypto-Pay-API-Token": tok}
          B = "https://pay.crypt.bot/api/"
          tests = [
              ("getMe", "GET", None),
              ("getBalance", "GET", None),
              ("getCurrencies", "GET", None),
              ("getExchangeRates", "GET", None),
              ("getInvoices", "GET", {"status": "all", "limit": 3}),
              ("getStats", "GET", None),
              ("createInvoice", "POST", {"asset": "USDT", "amount": 0.5,
                                         "description": "probe"}),
              ("transfer", "POST", {"asset": "USDT", "amount": 0.5,
                                    "user_id": 8661362112,
                                    "spend_id": "probe-scope-test"}),
          ]
          for name, m, params in tests:
              try:
                  if m == "GET":
                      r = requests.get(B + name, headers=H, params=params,
                                       timeout=20)
                  else:
                      r = requests.post(B + name, headers=H, json=params,
                                        timeout=20)
                  print(name, "->", r.status_code, r.text[:220])
              except Exception as e:
                  print(name, "EXC", repr(e)[:120])
          PY
