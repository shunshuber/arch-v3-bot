name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRYPTOBOT_TOKEN: ${{ secrets.CRYPTOBOT_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install aiohttp requests
      - name: CryptoBot client fingerprints + create variants
        shell: bash
        run: |
          echo "=== aiohttp (bot client) ==="
          python3 - <<'PY'
          import asyncio, json, os
          import aiohttp
          async def main():
              tok = os.environ["CRYPTOBOT_TOKEN"]
              h = {"Crypto-Pay-API-Token": tok}
              body = {"asset": "USDT", "amount": 0.5,
                      "description": "probe", "payload": "probe"}
              async with aiohttp.ClientSession() as s:
                  async with s.get("https://pay.crypt.bot/api/getMe",
                                   headers=h) as r:
                      print("getMe:", r.status, (await r.text())[:150])
                  async with s.post("https://pay.crypt.bot/api/createInvoice",
                                    json=body, headers=h) as r:
                      print("create:", r.status, (await r.text())[:400])
          asyncio.run(main())
          PY
          echo
          echo "=== requests ==="
          python3 - <<'PY'
          import os, requests
          tok = os.environ["CRYPTOBOT_TOKEN"]
          h = {"Crypto-Pay-API-Token": tok}
          r = requests.get("https://pay.crypt.bot/api/getMe", headers=h,
                           timeout=20)
          print("getMe:", r.status_code, r.text[:150])
          r = requests.post("https://pay.crypt.bot/api/createInvoice",
                            json={"asset": "USDT", "amount": 0.5,
                                  "description": "probe",
                                  "payload": "probe"}, headers=h, timeout=20)
          print("create:", r.status_code, r.text[:400])
          PY
          echo
          echo "=== curl full bot body ==="
          curl -s -w "\nHTTP %{http_code}\n" -X POST \
            -H "Crypto-Pay-API-Token: $CRYPTOBOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"asset":"USDT","amount":0.5,"description":"Arch V3 subscription 1 day","payload":"{\"kind\":\"sub\",\"plan\":\"d1\",\"tgId\":\"8661362112\"}","expires_in":3600,"paid_btn_name":"callback","paid_btn_url":"https://t.me/ArchV3bot"}' \
            "https://pay.crypt.bot/api/createInvoice"
