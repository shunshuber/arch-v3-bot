name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      XROCKET_TOKEN: ${{ secrets.XROCKET_TOKEN }}
      CRYPTOBOT_TOKEN: ${{ secrets.CRYPTOBOT_TOKEN }}
      MAINTENANCE: "0"
      SUB_CHANNEL_LINK: ${{ secrets.SUB_CHANNEL_LINK }}
      SUB_CHANNEL_ID: ${{ secrets.SUB_CHANNEL_ID }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      CREDS_MULTI: ${{ secrets.CREDENTIALS_LIST }}
      WEB_COUNT: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run bot 40s and capture output
        run: |
          echo "=== bot stdout/stderr (40s window) ==="
          timeout 40 python snoser.py 2>&1 | tail -60
          echo "=== exit captured ==="
