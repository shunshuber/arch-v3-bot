name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract Pay API reference details
        run: |
          python - <<'PY'
          import re, urllib.request

          def get(url):
              req = urllib.request.Request(url,
                                           headers={"User-Agent":
                                                    "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode("utf-8", errors="replace")

          pages = [
              "https://docs.xrocket.exchange/api/pay/pay-api-overview",
              "https://docs.xrocket.exchange/api/pay/migration-legacy",
              "https://docs.xrocket.exchange/api/pay/reference/http/"
              "app-controller-get-app",
              "https://docs.xrocket.exchange/api/pay/reference/http/"
              "invoice-controller-create-invoice",
              "https://docs.xrocket.exchange/api/pay/reference/http/"
              "invoice-controller-get-invoice",
              "https://docs.xrocket.exchange/api/pay/reference/http/"
              "invoice-controller-get-invoice-payments",
          ]
          for u in pages:
              try:
                  page = get(u)
              except Exception as e:
                  print("FAIL", u, repr(e)[:120])
                  continue
              text = re.sub(r"<script.*?</script>", " ", page, flags=re.S)
              text = re.sub(r"<style.*?</style>", " ", text, flags=re.S)
              text = re.sub(r"<[^>]+>", " ", text)
              text = re.sub(r"\s+", " ", text)
              print("PAGE:", u.rsplit("/", 1)[-1])
              for m in re.finditer(
                      r".{100}(base.?url|Bearer|Authorization|"
                      r"https://pay[^\s]*|GET /|POST /|DELETE /|"
                      r"X-API|api.?key).{180}", text, re.I):
                  print("  ...", m.group(0).strip()[:300], "...")
              print("---")
          PY
