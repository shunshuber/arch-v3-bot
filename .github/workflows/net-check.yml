name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cloudtips deep extraction
        shell: bash
        run: |
          echo "=== public page config json ==="
          for q in "api/paymentpages/a5139821?theme=LIGHT" \
                   "api/paymentpages/a5139821" \
                   "api/paymentpage/a5139821"; do
            echo "-- /$q"
            curl -s -o /tmp/p.json -w "HTTP %{http_code} size %{size_download}\n" \
              "https://api.cloudtips.ru/$q" -H "Accept: application/json" \
              -H "Origin: https://pay.cloudtips.ru" -H "Referer: https://pay.cloudtips.ru/"
            head -c 700 /tmp/p.json; echo
          done
          echo
          echo "=== main.js endpoint extraction ==="
          curl -s "https://pay.cloudtips.ru/main.53cccfc72e5faa58.js" -o /tmp/main.js
          python3 - <<'PY'
          import re
          t = open("/tmp/main.js", encoding="utf-8", errors="replace").read()
          eps = sorted(set(re.findall(
              r'requestService\.(get|post|put|delete)\(\s*"([^"]+)"', t)))
          for m, p in eps:
              print(f"{m.upper():6} {p}")
          print()
          for kw in ["amount", "comment"]:
              for m in re.finditer(kw, t, re.I):
                  s = t[max(0, m.start()-130):m.start()+170]
                  s = re.sub(r"\s+", " ", s)
                  print(f"[{kw}] ...{s}...")
                  print()
              break
          i = t.lower().find("queryparam")
          if i >= 0:
              print("queryparam ctx:", re.sub(r"\s+", " ", t[i-200:i+400])[:550])
          for kw in ["referrerParams", "URLSearchParams", "queryParams", "routeParam"]:
              i = t.find(kw)
              if i >= 0:
                  print(f"{kw} ctx:", re.sub(r"\s+", " ",
                        t[max(0,i-150):i+350])[:480])
          PY
