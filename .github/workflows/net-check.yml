name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XROCKET_TOKEN: ${{ secrets.XROCKET_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install aiohttp requests
      - name: client fingerprints + invoice schema + live create
        shell: bash
        run: |
          echo "=== aiohttp fingerprint test ==="
          python3 - <<'PY'
          import asyncio, os
          import aiohttp
          async def main():
              tok = os.environ["XROCKET_TOKEN"]
              h = {"Authorization": "Bearer " + tok}
              async with aiohttp.ClientSession() as s:
                  async with s.get("https://pay.api.xrocket.exchange"
                                   "/api/v1/app-info", headers=h) as r:
                      print("aiohttp:", r.status,
                            (await r.text())[:200])
          asyncio.run(main())
          PY
          echo
          echo "=== requests fingerprint test ==="
          python3 - <<'PY'
          import os, requests
          tok = os.environ["XROCKET_TOKEN"]
          r = requests.get("https://pay.api.xrocket.exchange/api/v1/app-info",
                           headers={"Authorization": "Bearer " + tok},
                           timeout=20)
          print("requests:", r.status_code, r.text[:200])
          PY
          echo
          echo "=== create-invoice page fields (curl) ==="
          curl -s "https://docs.xrocket.exchange/api/pay/reference/http/invoice-controller-create-invoice" -o /tmp/ci.html
          wc -c /tmp/ci.html
          python3 - <<'PY'
          import re
          t = open("/tmp/ci.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"<script.*?</script>", " ", t, flags=re.S)
          t = re.sub(r"<[^>]+>", " ", t)
          t = re.sub(r"\s+", " ", t)
          for m in re.finditer(r".{60}(amount|currency|description|payload|"
                               r"clientInvoiceId|expiresAt|telegramBotLink)"
                               r".{160}", t):
              print("...", m.group(0).strip()[:260], "...")
          PY
          echo
          echo "=== LIVE create invoice 0.5 USDT (curl) ==="
          curl -s -w "\nHTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $XROCKET_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"amount":0.5,"currency":"USDT","description":"probe","payload":"probe"}' \
            "https://pay.api.xrocket.exchange/api/v1/invoices"
          echo
          echo "=== get-invoice page fields (curl) ==="
          curl -s "https://docs.xrocket.exchange/api/pay/reference/http/invoice-controller-get-invoice" -o /tmp/gi.html
          python3 - <<'PY'
          import re
          t = open("/tmp/gi.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"<script.*?</script>", " ", t, flags=re.S)
          t = re.sub(r"<[^>]+>", " ", t)
          t = re.sub(r"\s+", " ", t)
          for m in re.finditer(r".{60}(invoiceId|clientInvoiceId|status|"
                               r"paidAmount|totalAmount).{160}", t):
              print("...", m.group(0).strip()[:260], "...")
          PY
