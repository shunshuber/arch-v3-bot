name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XROCKET_TOKEN: ${{ secrets.XROCKET_TOKEN }}
      CRYPTOBOT_TOKEN: ${{ secrets.CRYPTOBOT_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe CryptoBot and xRocket pay APIs
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          def hit(url, token, header):
              req = urllib.request.Request(url)
              req.add_header(header[0], header[1] + " " + token
                             if header[1] else token)
              req.add_header("User-Agent", "Mozilla/5.0")
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode("utf-8",
                                                       errors="replace")[:300]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8",
                                                 errors="replace")[:300]
              except Exception as e:
                  return 0, repr(e)[:200]

          ct = os.environ["CRYPTOBOT_TOKEN"]
          print("=== CryptoBot getMe ===")
          s, b = hit("https://pay.crypt.bot/api/getMe", ct,
                     ("Crypto-Pay-API-Token", ""))
          print(s, b)

          xr = os.environ["XROCKET_TOKEN"]
          print("=== xRocket host hunt (GET me) ===")
          for host in ["https://pay.api.xrocket.exchange/api/v1/me",
                       "https://xrocket.tg/api/v1/me",
                       "https://pay.xrocket.tg/api/v1/me",
                       "https://api.xrocket.tg/api/v1/me"]:
              s, b = hit(host, xr, ("Authorization", "Bearer"))
              print(host, "->", s, b[:220])
          PY
