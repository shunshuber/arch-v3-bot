name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XROCKET_TOKEN: ${{ secrets.XROCKET_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install aiohttp
      - name: discover invoice schema via validation errors
        shell: bash
        run: |
          echo "=== empty body -> full validation list ==="
          curl -s -X POST \
            -H "Authorization: Bearer $XROCKET_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://pay.api.xrocket.exchange/api/v1/invoices"
          echo
          echo
          echo "=== valid-ish body ==="
          curl -s -X POST \
            -H "Authorization: Bearer $XROCKET_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"priceAmount":0.5,"priceCurrency":"USDT","description":"probe","payload":"probe"}' \
            "https://pay.api.xrocket.exchange/api/v1/invoices"
          echo
          echo
          echo "=== get invoice probe ==="
          curl -s \
            -H "Authorization: Bearer $XROCKET_TOKEN" \
            "https://pay.api.xrocket.exchange/api/v1/invoices?limit=5"
