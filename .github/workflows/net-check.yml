name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XROCKET_TOKEN: ${{ secrets.XROCKET_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: curl retries + openapi spec
        shell: bash
        run: |
          echo "=== curl app-info x5 ==="
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/ai.json -w "%{http_code}" \
              -H "Authorization: Bearer $XROCKET_TOKEN" \
              "https://pay.api.xrocket.exchange/api/v1/app-info")
            echo "try $i -> $code $(head -c 300 /tmp/ai.json)"
            if [ "$code" = "200" ]; then break; fi
            sleep 3
          done
          echo
          echo "=== curl health ==="
          curl -s -o /tmp/h.txt -w "%{http_code} " \
            "https://pay.api.xrocket.exchange/health"
          head -c 200 /tmp/h.txt; echo
          echo
          echo "=== openapi json discovery ==="
          python3 - <<'PY'
          import re, urllib.request
          def get(url):
              req = urllib.request.Request(url)
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode("utf-8", errors="replace")
          page = get("https://docs.xrocket.exchange/api/pay/pay-api-overview")
          for m in re.finditer(r'href="([^"]*(openapi|swagger|json)[^"]*)"', page, re.I):
              print("href:", m.group(1))
          for m in re.finditer(r'https?://[^\s"\'<>]*(openapi|swagger)[^\s"\'<>]*', page, re.I):
              print("url:", m.group(0))
          PY
