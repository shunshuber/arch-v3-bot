name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: bot liveness via getUpdates conflict
        shell: bash
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /tmp/u.json -w "%{http_code}" \
              "https://api.telegram.org/bot$BOT_TOKEN/getUpdates?timeout=0")
            echo "try $i -> $code $(head -c 160 /tmp/u.json)"
            if [ "$code" = "409" ]; then echo "ALIVE: single instance polling"; break; fi
            sleep 15
          done
