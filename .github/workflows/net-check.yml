name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify custom_emoji rule across sources
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.parse

          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or
                                           {"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="replace")

          print("=== 1. core.telegram.org/bots/api — MessageEntity ===")
          try:
              page = get("https://core.telegram.org/bots/api")
              # strip html tags for readability around custom_emoji mentions
              text = re.sub(r"<[^>]+>", " ", page)
              text = re.sub(r"\s+", " ", text)
              text = re.sub(r"<[^>]+>", " ", page)
              text = re.sub(r"\s+", " ", text)
              for m in re.finditer(r".{400}Fragment.{500}", text):
                  print("...", m.group(0).strip(), "...")
                  print("---")
          except Exception as e:
              print("FETCH FAIL:", e)

          print()
          print("=== 2. bots/api-changelog — Bot API 7.0 ===")
          try:
              page = get("https://core.telegram.org/bots/api-changelog")
              text = re.sub(r"<[^>]+>", " ", page)
              text = re.sub(r"\s+", " ", text)
              for m in re.finditer(r".{200}custom.emoji.{340}", text):
                  print("...", m.group(0).strip(), "...")
                  print("---")
          except Exception as e:
              print("FETCH FAIL:", e)

          print()
          print("=== 3. Stack Overflow search ===")
          try:
              q = urllib.parse.quote("bot send custom emoji fragment")
              so = get(f"https://api.stackexchange.com/2.3/search/advanced?"
                       f"order=desc&sort=relevance&q={q}&site=stackoverflow")
              data = json.loads(so)
              for item in data.get("items", [])[:5]:
                  print("-", item.get("title"),
                        "| score:", item.get("score"),
                        "|", item.get("link"))
          except Exception as e:
              print("SEARCH FAIL:", e)

              for m in re.finditer(r".{400}or in the.{500}", text):
                  print("...", m.group(0).strip(), "...")
                  print("---")
          except Exception as e:
              print("FETCH FAIL:", e)

          print()
          print("=== 2b. full premium-subscription wording (9.4) ===")
          try:
              page = get("https://core.telegram.org/bots/api-changelog")
              text = re.sub(r"<[^>]+>", " ", page)
              text = re.sub(r"\s+", " ", text)
              for m in re.finditer(r".{160}Telegram Premium subscription.{420}",
                                   text):
                  print("...", m.group(0).strip(), "...")
                  print("---")
          except Exception as e:
              print("FETCH FAIL:", e)

          print()
          print("=== 4b. Stack Overflow answer 78314430 ===")
          try:
              so = get("https://api.stackexchange.com/2.3/questions/"
                       "78314430/answers?order=desc&sort=votes&"
                       "site=stackoverflow&filter=withbody")
              data = json.loads(so)
              for item in data.get("items", [])[:2]:
                  body = re.sub(r"<[^>]+>", " ", item.get("body", ""))
                  body = re.sub(r"\s+", " ", body).strip()
                  print("- answer score:", item.get("score"))
                  print(body[:900])
                  print("---")
          except Exception as e:
              print("SO FAIL:", e)

          print()
          print("=== 4. DuckDuckGo top results ===")
          try:
              q = urllib.parse.quote("telegram bot custom_emoji entity "
                                     "fragment username")
              ddg = get("https://html.duckduckgo.com/html/?q=" + q)
              for m in re.finditer(
                      r'<a rel="nofollow" class="result__a" href="([^"]+)">'
                      r'(.*?)</a>', ddg):
                  href, title = m.group(1), re.sub(r"<[^>]+>", "",
                                                   m.group(2))
                  print("-", title.strip()[:110], "|", href[:120])
          except Exception as e:
              print("SEARCH FAIL:", e)
          PY
