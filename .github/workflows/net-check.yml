name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XROCKET_TOKEN: ${{ secrets.XROCKET_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Find xRocket Pay API docs and endpoints
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error

          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or
                                           {"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode("utf-8",
                                                       errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8",
                                                 errors="replace")
              except Exception as e:
                  return 0, repr(e)

          print("=== docs candidates ===")
          for url in ["https://pay.api.xrocket.exchange/docs-json",
                      "https://pay.api.xrocket.exchange/docs",
                      "https://pay.xrocket.tg/docs-json",
                      "https://pay.xrocket.tg/docs",
                      "https://wiki.xrocket.tg/",
                      "https://docs.xrocket.tg/"]:
              s, b = get(url)
              print(url, "->", s, "len:", len(b))
              if s == 200 and len(b) < 400000:
                  print(b[:600].replace("\n", " ")[:600])
              print("---")

          print("=== DDG: xrocket pay api ===")
          s, b = get("https://html.duckduckgo.com/html/?q=" +
                     "xrocket+pay+api+create+invoice+documentation")
          for m in re.finditer(r'result__a[^>]*>(.*?)</a>', b):
              print("-", re.sub(r"<[^>]+>", "", m.group(1))[:110])
          for m in re.finditer(r'class="result__snippet"[^>]*>(.*?)</a>',
                               b, re.S):
              t = re.sub(r"<[^>]+>", " ", m.group(1))
              print("  ", re.sub(r"\s+", " ", t)[:180])
          PY
