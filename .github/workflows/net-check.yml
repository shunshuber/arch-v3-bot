name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XROCKET_TOKEN: ${{ secrets.XROCKET_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pay API schema + live probe
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error

          def get(url):
              req = urllib.request.Request(url,
                                           headers={"User-Agent":
                                                    "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode("utf-8", errors="replace")

          def totext(page):
              t = re.sub(r"<script.*?</script>", " ", page, flags=re.S)
              t = re.sub(r"<[^>]+>", " ", t)
              return re.sub(r"\s+", " ", t)

          print("=== create-invoice request schema ===")
          page = get("https://docs.xrocket.exchange/api/pay/reference/"
                     "http/invoice-controller-create-invoice")
          t = totext(page)
          i = t.find("amount")
          print(t[i:i + 3000])

          print()
          print("=== get-invoice schema ===")
          page = get("https://docs.xrocket.exchange/api/pay/reference/"
                     "http/invoice-controller-get-invoice")
          t = totext(page)
          i = t.find("Get invoice info")
          j = t.find("invoiceId")
          print(t[max(0, j - 400):j + 2600])

          print()
          print("=== LIVE app-info ===")
          tok = os.environ["XROCKET_TOKEN"]
          req = urllib.request.Request(
              "https://pay.api.xrocket.exchange/api/v1/app-info")
          req.add_header("Authorization", "Bearer " + tok)
          req.add_header("Content-Type", "application/json")
          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  print(r.status, r.read().decode()[:400])
          except urllib.error.HTTPError as e:
              print(e.code, e.read().decode(errors="replace")[:400])

          print()
          print("=== LIVE create invoice (0.5 USDT probe) ===")
          body = {"amount": 0.5, "currency": "USDT",
                  "description": "probe", "payload": "probe"}
          req = urllib.request.Request(
              "https://pay.api.xrocket.exchange/api/v1/invoices",
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json",
                       "Authorization": "Bearer " + tok},
              method="POST")
          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  print(r.status, r.read().decode()[:600])
          except urllib.error.HTTPError as e:
              print(e.code, e.read().decode(errors="replace")[:600])
          PY
