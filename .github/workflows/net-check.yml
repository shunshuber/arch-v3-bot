name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe hero gif by URL (head + real sendAnimation)
        run: |
          python - <<'PY'
          import json, os, urllib.request

          URL = ("https://huggingface.co/datasets/Eraserr/erase-media"
                 "/resolve/main/gifs.gif")

          req = urllib.request.Request(URL, method="HEAD",
                                       headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("HEAD status:", r.status)
              print("content-type:", r.headers.get("Content-Type"))
              print("content-length:", r.headers.get("Content-Length"))
              final = r.geturl()
              print("final url:", final[:160])

          tok = os.environ["BOT_TOKEN"]
          chat = os.environ["ADMIN_ID"]
          payload = {
              "chat_id": chat,
              "animation": URL,
              "caption": ("<blockquote><b>Arch V3</b></blockquote>\n"
                          "probe caption"),
              "parse_mode": "HTML",
          }
          req2 = urllib.request.Request(
              "https://api.telegram.org/bot" + tok + "/sendanimation",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req2, timeout=90) as r:
                  res = json.load(r)
              m = res.get("result", {})
              anim = m.get("animation") or {}
              print("SEND ok:", res.get("ok"))
              print("file_id:", (anim.get("file_id") or "")[:80])
              print("duration:", anim.get("duration"),
                    "| w:", anim.get("width"), "| h:", anim.get("height"))
              print("mime:", anim.get("mime_type"),
                    "| name:", anim.get("file_name"))
          except Exception as e:
              body = getattr(e, "read", lambda: b"")()
              print("SEND FAIL:", body.decode(errors="replace")[:400])
          PY
