name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: cloudtips page json full + cabinet discovery
        shell: bash
        run: |
          echo "=== full page json ==="
          curl -s "https://api.cloudtips.ru/api/paymentpages/a5139821" \
            -H "Accept: application/json" \
            -H "Origin: https://pay.cloudtips.ru" \
            -H "Referer: https://pay.cloudtips.ru/" \
            -w "\nHTTP %{http_code}\n"
          echo
          echo "=== cabinet hosts ==="
          for u in "https://lk.cloudtips.ru/" \
                   "https://app.cloudtips.ru/" \
                   "https://cabinet.cloudtips.ru/" \
                   "https://cloudtips.ru/" \
                   "https://www.cloudtips.ru/api/v1/methods"; do
            echo "-- $u"
            curl -s -L -o /tmp/h.txt -w "HTTP %{http_code} size %{size_download} final:%{url_effective}\n" "$u"
            head -c 300 /tmp/h.txt; echo
          done
