name: net-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRYPTOBOT_TOKEN: ${{ secrets.CRYPTOBOT_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CryptoBot createInvoice variants
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          tok = os.environ["CRYPTOBOT_TOKEN"]
          URL = "https://pay.crypt.bot/api/createInvoice"

          def call(body):
              req = urllib.request.Request(
                  URL, data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json",
                           "Crypto-Pay-API-Token": tok},
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode()[:500]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="replace")[:500]
              except Exception as e:
                  return 0, repr(e)[:200]

          full = {
              "asset": "USDT",
              "amount": 0.5,
              "description": "Arch V3 subscription 1 день",
              "payload": json.dumps({"kind": "sub", "plan": "d1",
                                     "tgId": "8661362112"}),
              "expires_in": 3600,
              "paid_btn_name": "callback",
              "paid_btn_url": "https://t.me/ArchV3bot",
          }
          variants = [
              ("full bot body", full),
              ("no paid_btn", {k: v for k, v in full.items()
                               if not k.startswith("paid_btn")}),
              ("no expires_in", {k: v for k, v in full.items()
                                 if k != "expires_in"}),
              ("amount string", {**{k: v for k, v in full.items()
                                    if k != "amount"},
                                 "amount": "0.5"}),
              ("bare", {"asset": "USDT", "amount": 0.5,
                        "description": "probe"}),
          ]
          for name, body in variants:
              s, b = call(body)
              print(f"--- {name}: {s} {b}")
          PY
