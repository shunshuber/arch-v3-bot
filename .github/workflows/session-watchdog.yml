name: session-watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: session-watchdog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Watchdog pass
        run: |
          echo "watchdog pass started at $(date -u +%H:%M:%S)"
          python session_watchdog.py once
      - name: Commit pool state
        run: |
          git config user.name "arch-bot"
          git config user.email "arch@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no pool state change"
          else
            git commit -m "watchdog: pool state (slots/status/sessions)" || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi