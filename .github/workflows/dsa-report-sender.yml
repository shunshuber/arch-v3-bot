name: dsa-report-sender

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send DSA complaint to dsa@telegram.org
        run: python dsa_report.py
      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: dsa-log
          path: dsa_tracked_log.txt
