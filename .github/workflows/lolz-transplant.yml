name: lolz-transplant

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "stems to transplant now, comma separated (bypasses 25h age gate)"
        required: false
        default: ""

concurrency:
  group: lolz-transplant
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  transplant:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ARCH_BOT_TOKEN: ${{ secrets.ARCH_BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_STEMS: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Transplant lolz sessions (long uninterrupted run)
        run: |
          python - <<'PY'
          import asyncio, os, snoser

          async def fake_push(title, lines):
              print(f"[LOG {title}]", flush=True)
              for line in lines:
                  print("   ", line, flush=True)
          snoser.push_send_log = fake_push

          force = [s.strip() for s in (os.environ.get("FORCE_STEMS") or "").split(",")
                   if s.strip()]
          if force:
              snoser.TRANSPLANT_MIN_AGE_SEC = 0
              print("[TRANSPLANT] FORCE", force, flush=True)

          async def go():
              if force:
                  sess = [p for p in snoser._transplant_list()
                          if p.stem in set(force)]
              else:
                  sess = snoser._transplant_due_list()
              print("[TRANSPLANT] due:", [p.name for p in sess], flush=True)
              print("[TRANSPLANT] queue:", snoser._queue_load(), flush=True)
              for s in sess:
                  print(f"[TRANSPLANT] start {s.stem}", flush=True)
                  try:
                      ok = await snoser._transplant_one(s)
                      print(f"[TRANSPLANT] result {s.stem}: {ok}", flush=True)
                  except Exception as e:
                      print(f"[TRANSPLANT] EXCEPTION {s.stem}: {type(e).__name__}: {e}", flush=True)
                      ok = False
                  if ok is True or not force:
                      await snoser._transplant_mark(s, ok is True)
                  elif ok is False and force:
                      print(f"[TRANSPLANT] {s.stem}: failed on forced try, "
                            f"25h schedule kept", flush=True)
                  print(f"[TRANSPLANT] queue:", await asyncio.to_thread(snoser._queue_load), flush=True)
              moved = await snoser.add_ready_to_pool()
              print("[POOL] added:", moved, flush=True)

          asyncio.run(go())
          PY
      - name: Commit results
        run: |
          git config user.name arch-bot
          git config user.email arch@users.noreply.github.com
          git add -A
          git -c user.name=arch-bot -c user.email=arch@users.noreply.github.com commit -m "lolz transplant results" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
