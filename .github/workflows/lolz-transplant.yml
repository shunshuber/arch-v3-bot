name: lolz-transplant

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transplant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Transplant lolz sessions (long uninterrupted run)
        run: |
          python - <<'PY'
          import asyncio, snoser

          async def fake_push(title, lines):
              print(f"[LOG {title}]", flush=True)
              for line in lines:
                  print("   ", line, flush=True)
          snoser.push_send_log = fake_push

          async def go():
              sess = snoser._transplant_list()
              print("[TRANSPLANT] sources:", [p.name for p in sess], flush=True)
              for s in sess:
                  print(f"[TRANSPLANT] start {s.stem}", flush=True)
                  try:
                      ok = await snoser._transplant_one(s)
                      print(f"[TRANSPLANT] result {s.stem}: {ok}", flush=True)
                  except Exception as e:
                      print(f"[TRANSPLANT] EXCEPTION {s.stem}: {type(e).__name__}: {e}", flush=True)

          asyncio.run(go())
          PY
      - name: Commit results
        run: |
          git add sessions/ lolz/ report_ledger.json session_status.json 2>/dev/null || true
          git -c user.name=arch-bot -c user.email=arch@users.noreply.github.com commit -m "lolz transplant results" || true
          git pull --rebase origin main || true
          git push || true
