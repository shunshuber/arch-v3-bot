name: emoji-api-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe custom_emoji send to private chat (owner has Premium)
        run: |
          python - <<'PY'
          import json, os, urllib.request

          tok = os.environ["BOT_TOKEN"]
          chat = os.environ["ADMIN_ID"]
          eid = "5357069174512303778"   # ✅ from tgmacicons
          text = "✅ test custom emoji send (private chat, owner premium)"

          payload = {
              "chat_id": chat,
              "text": text,
              "entities": [{
                  "type": "custom_emoji",
                  "offset": 0,
                  "length": 1,
                  "custom_emoji_id": eid,
              }],
          }
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{tok}/sendmessage",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as r:
              res = json.load(r)
          msg = res.get("result", {})
          print("SENT entities:", json.dumps(msg.get("entities"),
                                             ensure_ascii=False))
          print("SENT full:", json.dumps(res, ensure_ascii=False)[:500])

          # button with custom emoji icon (Bot API 9.4)
          kb = {"inline_keyboard": [[{
              "text": "Проверить эмодзи-кнопку",
              "icon_custom_emoji_id": eid,
              "callback_data": "noop",
          }]]}
          payload2 = {
              "chat_id": chat,
              "text": "тест кастом-иконки на кнопке",
              "reply_markup": kb,
          }
          req2 = urllib.request.Request(
              f"https://api.telegram.org/bot{tok}/sendmessage",
              data=json.dumps(payload2).encode(),
              headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req2, timeout=30) as r:
                  res2 = json.load(r)
              print("BUTTON ok:", res2.get("ok"))
          except Exception as e:
              body = getattr(e, "read", lambda: b"")()
              print("BUTTON fail:", body.decode(errors="replace")[:400])

          # forward echo: does the stored message keep the custom entity?
          if msg.get("message_id"):
              fwd = {"chat_id": chat, "from_chat_id": chat,
                     "message_id": msg["message_id"]}
              req3 = urllib.request.Request(
                  f"https://api.telegram.org/bot{tok}/forwardmessage",
                  data=json.dumps(fwd).encode(),
                  headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req3, timeout=30) as r:
                  res3 = json.load(r)
              print("FORWARD entities:",
                    json.dumps(res3.get("result", {}).get("entities"),
                               ensure_ascii=False))
          PY
