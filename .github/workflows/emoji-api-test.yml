name: emoji-api-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      LOGS_CHAT_ID: ${{ secrets.LOGS_CHAT_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe custom_emoji send via Bot API
        run: |
          python - <<'PY'
          import json, os, urllib.request

          tok = os.environ["BOT_TOKEN"]
          chat = os.environ["LOGS_CHAT_ID"]
          eid = "5357069174512303778"   # ✅ from tgmacicons
          text = "✅ test custom emoji send"

          payload = {
              "chat_id": chat,
              "text": text,
              "entities": [{
                  "type": "custom_emoji",
                  "offset": 0,
                  "length": 1,
                  "custom_emoji_id": eid,
              }],
          }
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{tok}/sendmessage",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as r:
              res = json.load(r)
          print("RESULT:", json.dumps(res, ensure_ascii=False)[:600])

          # forward echo: does the stored message keep the custom entity?
          fwd = {
              "chat_id": chat,
              "from_chat_id": chat,
              "message_id": res["result"]["message_id"],
          }
          req2 = urllib.request.Request(
              f"https://api.telegram.org/bot{tok}/forwardmessage",
              data=json.dumps(fwd).encode(),
              headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req2, timeout=30) as r:
              res2 = json.load(r)
          ent = res2.get("result", {}).get("entities")
          print("FORWARD entities:", json.dumps(ent, ensure_ascii=False))
          print("FORWARD full:", json.dumps(res2, ensure_ascii=False)[:400])
          PY
