name: stars-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARCH_BOT_TOKEN: ${{ secrets.ARCH_BOT_TOKEN }}
    steps:
      - name: Probe XTR capabilities on the cashier token
        run: |
          set -e
          T="$ARCH_BOT_TOKEN"
          api() { curl -s -m 15 "https://api.telegram.org/bot$T/$1" -H 'Content-Type: application/json' -d "$2"; echo; }

          echo "== getMe =="
          api getMe '{}'

          echo "== createInvoiceLink (XTR, one-time 400) =="
          api createInvoiceLink '{"title":"Arch V3 - 30 days","description":"Access payment: 30 days","payload":"probe:d30:0","currency":"XTR","prices":[{"label":"30 days","amount":400}]}'

          echo "== createInvoiceLink (XTR, subscription 30d) =="
          api createInvoiceLink '{"title":"Arch V3 - subscription","description":"Access: 30 days auto","payload":"probe:sub30:0","currency":"XTR","prices":[{"label":"30 days","amount":400}],"subscription_period":2592000}'

          echo "== sendInvoice XTR to a chat (must fail without chat) =="
          api sendInvoice '{"chat_id":1,"title":"probe","description":"probe","payload":"probe:x:0","currency":"XTR","prices":[{"label":"p","amount":1}]}'
