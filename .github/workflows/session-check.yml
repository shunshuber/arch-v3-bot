name: session-check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: session-check
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe sessions
        run: python check_sessions.py
      - name: Commit health status
        run: |
          git config user.name "arch-bot"
          git config user.email "arch@users.noreply.github.com"
          git add session_status.json || true
          if git diff --cached --quiet; then
            echo "no status change"
          else
            git commit -m "session health: probe results"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
