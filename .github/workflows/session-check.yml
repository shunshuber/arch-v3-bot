name: session-check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: session-check
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Mark wash active
        run: |
          python - <<'PY'
          import asyncio, json, time, store
          txt = json.dumps({"active": True, "started": time.time(), "eta": 300})
          asyncio.run(store._gh_put_text("wash_status.json", txt, "wash started"))
          PY
      - name: Probe sessions
        run: python check_sessions.py
      - name: Mark wash done
        if: always()
        run: |
          python - <<'PY'
          import asyncio, json, time, store
          txt = json.dumps({"active": False, "finished": time.time()})
          asyncio.run(store._gh_put_text("wash_status.json", txt, "wash done"))
          PY
      - name: Commit health status
        run: |
          git config user.name "arch-bot"
          git config user.email "arch@users.noreply.github.com"
          git add session_status.json || true
          if git diff --cached --quiet; then
            echo "no status change"
          else
            git commit -m "session health: probe results"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
